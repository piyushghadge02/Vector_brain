# Production static server for the built SPA.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Must cover the backend's upload limit (MAX_FILE_MB × MAX_FILES_PER_REQUEST);
  # nginx's 1 MB default would otherwise reject large PDF uploads with 413.
  client_max_body_size 520m;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API reverse proxy: the SPA calls same-origin /api, so the browser never
  # needs a baked-in backend URL and CORS is a non-issue in production.
  # Forwarded headers let the backend see the real client IP (rate limiting)
  # and scheme behind the proxy.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

  # Cache-busted assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
