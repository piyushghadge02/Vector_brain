name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vectorbrain
          POSTGRES_PASSWORD: vectorbrain
          POSTGRES_DB: vectorbrain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vectorbrain -d vectorbrain_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-test.txt
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://vectorbrain:vectorbrain@localhost:5432/vectorbrain_test
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://vectorbrain:vectorbrain@localhost:5432/vectorbrain_test
        # real_model tests download ~100MB of ML models; run them in a
        # separate extended job, not on every PR.
        run: pytest -v -m "not real_model"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx vue-tsc --noEmit -p tsconfig.app.json
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Ensure no secrets in bundle
        working-directory: frontend
        run: |
          ! grep -rEi 'gsk_[A-Za-z0-9]{10,}|sk-[A-Za-z0-9]{10,}' dist/ \
            && echo "bundle clean"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for leaked secrets in tracked files
        run: |
          ! grep -rEn --exclude-dir=node_modules --exclude-dir=.git \
            -e 'gsk_[A-Za-z0-9]{10,}' \
            -e 'GROQ_API_KEY=gsk_[A-Za-z0-9]{10,}' \
            . | grep -v '.env.example' \
            && echo "no secrets found"
