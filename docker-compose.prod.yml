# ── VectorBrain production override ──────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# Set real secrets via environment (never in this file):
#   GROQ_API_KEY=<redacted>  docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# What this override changes vs. the dev file:
# - backend runs with 2 uvicorn workers, no --reload, ENV=prod (JSON logs,
#   /docs and /redoc disabled)
# - postgres and backend ports are NOT published — only nginx (:80) is
#   reachable from the host; the SPA talks to the API via nginx's /api/
#   reverse proxy (same origin, no CORS needed)
# - uploaded PDFs persist in a named volume (container restarts must not
#   orphan the files the database references)
services:
  db:
    ports: !reset []

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers
    environment:
      ENV: prod
      LOG_LEVEL: INFO
      # GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required in prod}
    ports: !reset []
    volumes:
      - uploads:/data/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile # multi-stage: build → nginx
    ports:
      - "80:80"
    volumes: !reset []
    environment: !reset []

volumes:
  uploads:
